<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Your Frame — FRAIMOUS</title><link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#f0e6dc;--bone:#f6efe6;--mute:#a08d7c;--line:#3a281c;--neon:#d4a574}
*{box-sizing:border-box}html,body{margin:0;background:#120c0a url(/suede.jpg) center top/880px;color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:40px 24px 56px;min-height:100vh;display:flex;flex-direction:column}
.mark{width:150px;display:block}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--neon);margin:56px 0 18px}
h1{font:700 38px/1.05 Syne,sans-serif;letter-spacing:-.025em;margin:0 0 14px;color:var(--bone);text-wrap:balance}
p.lead{margin:0;color:#c9b8a8;font-size:16px;line-height:1.5;text-wrap:pretty}
.code{display:flex;gap:8px;margin:32px 0 8px}.code span{flex:1;height:58px;border:1px solid #5a4030;display:flex;align-items:center;justify-content:center;font:500 26px "IBM Plex Mono",monospace;color:var(--bone);background:rgba(20,12,9,.6)}
.sub{font:400 12px "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.plans{display:grid;gap:10px;margin:0 0 26px}.group{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:34px 0 12px}.plan.owned{opacity:.45;cursor:default}button:disabled{opacity:.5}
.plan{border:1px solid #5a4030;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:rgba(20,12,9,.55);transition:border-color .2s}
.plan.sel{border-color:var(--ink);background:rgba(40,26,19,.7)}.plan b{font:600 18px Syne,sans-serif;color:var(--bone)}.plan small{display:block;margin-top:6px;color:var(--mute);font-size:13px}
.plan i{width:16px;height:16px;border:1px solid var(--mute);border-radius:50%}.plan.sel i{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px #2a1c14}
button{appearance:none;border:0;width:100%;padding:18px;background:var(--bone);color:#1a100c;font:500 13px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.test{margin-top:18px;padding:10px 12px;border:1px dashed #6e5a4a;font:400 11px/1.5 "IBM Plex Mono",monospace;color:var(--mute);letter-spacing:.06em}
.foot{margin-top:auto;padding-top:40px;font:400 11px "IBM Plex Mono",monospace;letter-spacing:.12em;color:#6e5a4a;text-transform:uppercase}
.err{color:#e59a7a}
.check{width:64px;height:64px;border:1px solid var(--neon);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:56px;color:var(--neon);font-size:28px}
</style></head><body><main>
<img class="mark" src="/wordmark.png" alt="FRAIMOUS">
<div id="view"></div>
<div class="foot">FRAIMOUS for The Frame</div>
</main>
<script>
var q=new URLSearchParams(location.search),code=(q.get('code')||'').toUpperCase(),v=document.getElementById('view'),plan=null;
function codeBoxes(){return '<div class="code">'+code.split('').map(function(c){return '<span>'+c+'</span>'}).join('')+'</div>'}
function opt(k,o,owned){return '<div class="plan'+(owned?' owned':'')+'" data-k="'+k+'"><div><b>'+o.label+'</b><small>'+(owned?'Already Unlocked':o.display)+'</small></div><i></i></div>'}
if(q.get('done')){var pl=q.get('plan')||'';v.innerHTML='<div class="check">&#10003;</div><div class="eyebrow" style="margin-top:28px">'+(pl.indexOf('pack:')===0?'Pack Unlocked':'Membership Active')+'</div><h1>Your Frame Is Unlocked</h1><p class="lead">Your TV updates on its own in a few seconds. You can put your phone away.</p><p class="lead" style="margin-top:22px"><a href="/link?code='+code+'" style="color:#d4a574">Add Another Pack</a></p>'}
else fetch('/api/pair/lookup?code='+code).then(function(r){return r.json()}).then(function(d){
 if(!d.ok){v.innerHTML='<div class="eyebrow">Link Your Frame</div><h1>This Code Has Expired</h1><p class="lead err">Open FRAIMOUS on your TV to get a fresh code.</p>';return}
 var h='<div class="eyebrow">Link Your Frame</div><h1>Unlock the Collection</h1><p class="lead">Confirm this code matches your TV, then choose a pack or the full collection.</p>'+codeBoxes()+'<div class="sub">Code from your TV</div>';
 h+='<div class="group">Collection Packs</div><div class="plans">'+Object.keys(d.packs).map(function(k){return opt('pack:'+k,d.packs[k],d.owned.all||d.owned.packs.indexOf(k)>=0)}).join('')+'</div>';
 h+='<div class="group">Full Collection</div><div class="plans">'+Object.keys(d.memberships).map(function(k){return opt(k,d.memberships[k],d.owned.all)}).join('')+'</div>';
 h+='<button id="go" disabled>Choose an Option</button>'+(d.mock?'<div class="test">TEST MODE: mock checkout. No payment is taken. Prices are placeholder proposals.</div>':'<div class="test">TEST MODE: Stripe test checkout. Use a test card only.</div>');
 v.innerHTML=h;var go=document.getElementById('go');
 [].forEach.call(document.querySelectorAll('.plan:not(.owned)'),function(el){el.onclick=function(){plan=el.dataset.k;[].forEach.call(document.querySelectorAll('.plan'),function(x){x.classList.toggle('sel',x===el)});go.disabled=false;go.textContent='Continue to Checkout'}});
 go.onclick=function(){if(!plan)return;go.textContent='One Moment…';fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,plan:plan})}).then(function(r){return r.json()}).then(function(s){if(s.url)location.href=s.url;else{go.textContent='Try Again';alert(s.error||'Error')}})};
});
</script></body></html>
